<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Map Ta Phut Area</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap">
<style>
:root{--fg:#fff;--mut:#d6dcff;--ac:#8b5cf6;--gl:rgba(255,255,255,.11);--gl2:rgba(16,11,52,.62);--bd:rgba(255,255,255,.3);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;display:flex;flex-direction:column;color:var(--fg);font:500 16px/1.6 "Noto Sans Thai",system-ui,sans-serif;background:#0d0a2e;text-shadow:0 1px 2px rgba(0,0,0,.45);overflow:hidden}
body::before{content:"";position:fixed;inset:-15%;z-index:-1;background:radial-gradient(40% 40% at 18% 22%,rgba(109,74,224,.75),transparent 70%),radial-gradient(35% 35% at 85% 25%,rgba(6,182,212,.55),transparent 70%),radial-gradient(40% 40% at 70% 92%,rgba(236,72,153,.4),transparent 70%),linear-gradient(135deg,#120d33,#0b2a4a);animation:fl 18s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(3%,-3%) scale(1.08)}}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateX(26px) scale(.95)}to{opacity:1;transform:none}}
@keyframes bn{50%{transform:translate(-50%,-100%) scale(calc(var(--k,1)*1.2))}}
@keyframes rp{to{transform:scale(1);opacity:0}}@keyframes pl{0%{opacity:1}100%{opacity:.2}}
header,.pn,.gl,.gc,.kp div,.ig div,.cd,.cc,.rl div,.bt,nav button,#q,.gi{background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);box-shadow:0 8px 28px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.4)}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;z-index:20;border-width:0 0 1px;border-radius:0}
.lg1{display:flex;gap:10px;align-items:center;margin-right:auto}.lg1 svg{width:40px;height:40px}.lg1 b{font-size:22px;display:block;line-height:1.15}.lg1 small{color:var(--mut);font-size:13px}
nav{display:flex;gap:6px;flex-wrap:wrap}
.bt,nav button{font:inherit;font-weight:600;color:#fff;border-radius:99px;padding:7px 18px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,background .2s,box-shadow .2s;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.bt:hover,nav button:hover{background:rgba(255,255,255,.2);transform:translateY(-1px)}.bt:active,nav button:active,.cd:active,.cc:active,.rl div:active{transform:scale(.94)}
nav button.on,.bt.pr{background:linear-gradient(135deg,rgba(139,92,246,.95),rgba(14,165,233,.8));border-color:rgba(255,255,255,.5);box-shadow:0 4px 18px rgba(139,92,246,.6),inset 0 1px 0 rgba(255,255,255,.5)}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .6s ease-out;pointer-events:none}
#q,.gi{font:inherit;font-weight:500;color:#fff;border-radius:99px;padding:7px 18px;width:230px;outline:0}#q::placeholder,.gi::placeholder{color:#cfd6ff}#q:focus,.gi:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(139,92,246,.6)}
main{flex:1;position:relative;min-height:0}.v{position:absolute;inset:0;display:none}.v.on{display:block;animation:up .35s ease}
#mp{overflow:hidden;background:#0a1020;touch-action:none;cursor:grab}#wd{position:absolute;left:0;top:0;transform-origin:0 0}#wd img{display:block;user-select:none;-webkit-user-drag:none}#bub{position:absolute;inset:0}
.bb{position:absolute;transform:translate(-50%,-100%) scale(var(--k,1));transform-origin:50% 100%;font:700 14px "Noto Sans Thai",sans-serif;color:#fff;background:rgba(16,11,52,.82);border:2px solid var(--c);border-radius:99px;padding:3px 14px 3px 9px;cursor:pointer;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.55);display:flex;gap:6px;align-items:center;backdrop-filter:blur(6px);text-shadow:none}
.bb i{width:12px;height:12px;border-radius:50%;background:var(--c)}.bb::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--c);border-bottom:0}
.bb.on{background:var(--c);color:#111;animation:bn .4s}.bb.on i{background:#111}.bb.off{display:none}
.rg{position:absolute;border-radius:50%;border:3px solid var(--c);transform:translate(-50%,-50%);pointer-events:none;animation:pl 1.6s infinite}
.ct{position:absolute;transform:translate(-50%,-50%) scale(var(--k,1));background:#38bdf8;color:#06283d;font:700 12px "Noto Sans Thai",sans-serif;padding:0 6px;border-radius:5px;border:1px solid #fff;pointer-events:none;text-shadow:none}
#cs{font:inherit;font-size:12px;color:#fff;background:#241a5e;border:1px solid var(--bd);border-radius:8px;max-width:130px}
.pn{position:absolute;background:var(--gl2);border-radius:18px;z-index:5}
#lgd{left:12px;top:12px;width:240px;padding:12px 14px}#lgd summary{font-weight:700;font-size:16px;cursor:pointer}#lgd label{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:14px;cursor:pointer}#lgd input{accent-color:#8b5cf6;width:16px;height:16px}.sw{width:16px;height:16px;border-radius:4px;border:1px solid #fff8;display:inline-block}
#ic{right:12px;top:12px;width:310px;max-height:calc(100% - 24px);overflow:auto;display:none;padding:0}#ic.pop,#ic3.pop{animation:pop .32s cubic-bezier(.2,.9,.3,1.2)}
#ic h3{margin:0;padding:14px 16px;display:flex;justify-content:space-between;gap:8px;font-size:18px;background:linear-gradient(90deg,rgba(139,92,246,.6),rgba(14,165,233,.35));border-radius:18px 18px 0 0}#ic h3 button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.rw{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.2)}.rw small{color:var(--mut);display:block;font-size:13px}.rw b{font-size:24px}
.ch{display:flex;flex-wrap:wrap;gap:5px;font-size:13px}.ch span{border:1px solid var(--bd);border-radius:8px;padding:1px 8px;background:rgba(255,255,255,.1)}
#ic .bt{display:block;width:calc(100% - 28px);margin:12px 14px;text-align:center}
#zc{right:12px;bottom:12px;display:flex;flex-direction:column;border-radius:14px;overflow:hidden}#zc button{font:inherit;font-size:22px;width:44px;height:44px;background:none;border:0;color:#fff;cursor:pointer;border-bottom:1px solid var(--bd);transition:background .15s,transform .1s}#zc button:hover{background:rgba(255,255,255,.2)}#zc button:active{transform:scale(.85)}
#mmb{position:absolute;left:12px;bottom:12px;z-index:6;padding:6px 14px}#mm{display:none;left:12px;bottom:58px;width:180px;padding:8px}#mm svg{display:block;width:100%}#mm small{font-size:12px;color:var(--mut)}
.pg{padding:20px;overflow:auto;max-width:1180px;margin:0 auto;height:100%}.pg h2{margin:0 0 14px;font-size:26px}.pg h2 small{font-size:15px;color:var(--mut);font-weight:500}
.hero{padding:24px;margin-bottom:16px;border-radius:24px}.hero h2{font-size:30px;margin:0 0 6px}.hero p{margin:0;color:var(--mut);font-size:17px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}.kp div{border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center}.kp i{font-style:normal;font-size:32px}.kp b{font-size:32px;line-height:1.1;display:block}.kp small{color:var(--mut);font-size:14px}
.cr{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;margin-bottom:16px}.gc{border-radius:22px;padding:18px;margin-bottom:0}.gc h3{margin:0 0 12px;font-size:18px}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.dn svg{width:170px;height:170px;flex:none}.dl{flex:1;min-width:180px}.dl div{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:15px}.dl b{margin-left:auto}.dl em{font-style:normal;color:var(--mut);width:44px;text-align:right}
.hb .r{display:grid;grid-template-columns:130px 1fr 70px;gap:8px;align-items:center;margin:11px 0;font-size:14.5px}.hb b{text-align:right}.hb .t{height:14px;border-radius:14px;background:rgba(255,255,255,.14);overflow:hidden}.hb .t i{display:block;height:100%;border-radius:14px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:16px}.ig div{padding:16px;border-radius:20px}.ig small{color:var(--mut);display:block;font-size:14px}.ig b{font-size:20px;display:block;margin:2px 0}
.tb{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:15px}.tb th{color:var(--mut);font-weight:600;text-align:left;padding:4px 12px}.tb td{padding:10px 12px;background:rgba(255,255,255,.08)}.tb td:first-child{border-radius:12px 0 0 12px}.tb td:last-child{border-radius:0 12px 12px 0}.tb .n{text-align:right}.tb th.n{text-align:right}
.pg>*,.kp>*,.ig>*,.cr>*{animation:up .5s both}.kp>*:nth-child(2),.ig>*:nth-child(2){animation-delay:.07s}.kp>*:nth-child(3),.ig>*:nth-child(3){animation-delay:.14s}.kp>*:nth-child(4),.ig>*:nth-child(4){animation-delay:.21s}.cr>*:nth-child(2){animation-delay:.1s}
.gd,.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.cd,.cc{border-radius:20px;padding:16px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s}.cd:hover,.cc:hover{transform:translateY(-4px)}
.cd h4{margin:0 0 6px;display:flex;gap:8px;align-items:center;font-size:17px}.cd p{margin:2px 0;color:var(--mut);font-size:14.5px}.br{height:9px;border-radius:9px;background:rgba(255,255,255,.15);margin-top:10px}.br i{display:block;height:100%;border-radius:9px}
.cg{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.cc{display:flex;gap:12px;align-items:center;padding:12px 14px;font-size:15.5px;font-weight:600}.cc i{flex:none;width:50px;height:46px;border-radius:14px;background:linear-gradient(135deg,#7dd3fc,#22d3ee);color:#05283a;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:16px;text-shadow:none}
.fl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.fl .bt{padding:4px 14px;font-size:14px}.fl .bt.on{background:linear-gradient(135deg,rgba(139,92,246,.95),rgba(14,165,233,.8))}
.rl{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px}.rl div{display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:14px;cursor:pointer;font-size:15px;position:relative;overflow:hidden;transition:transform .15s}.rl div:hover{transform:translateY(-2px)}.rl em{font-style:normal;color:var(--mut);font-size:13px;min-width:28px}.rl u{width:11px;height:11px;border-radius:50%;flex:none}.nt{color:var(--mut);font-size:14px;margin:10px 0}
@media(max-width:700px){header{gap:8px}#q{width:100%;order:5}#lgd{width:200px}#ic{right:0;left:0;top:auto;bottom:0;width:auto;max-height:55%;border-radius:18px 18px 0 0}.hb .r{grid-template-columns:100px 1fr 62px}.lg1 b{font-size:19px}}
</style></head><body>
